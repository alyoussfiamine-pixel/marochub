<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amine Elyoussfi | Social Links</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 420px;
            padding: 35px 20px;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .avatar-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 15px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #53FC18;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(83, 252, 24, 0.3);
        }

        .profile-card h1 {
            font-size: 22px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .profile-card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .social-link {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 18px;
            border-radius: 16px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            position: relative;
        }

        .social-link i {
            font-size: 20px;
            width: 30px;
            text-align: center;
        }

        .social-link span {
            flex-grow: 1;
            text-align: center;
        }

        /* تخصيص الألوان لكل منصة عند مرور الماوس */
        .social-link.web:hover { background: #3b82f6; border-color: #3b82f6; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4); }
        .social-link.github:hover { background: #24292e; border-color: #ffffff; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2); }
        .social-link.insta:hover { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #df5950 45%, #a24bcf 60%, #2b6cb0 90%); border-color: transparent; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(223, 89, 80, 0.4); }
        .social-link.tiktok:hover { background: #00f2fe; color: #000; border-color: #00f2fe; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4); }
        .social-link.youtube:hover { background: #ff0000; border-color: #ff0000; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 0, 0, 0.4); }

        .footer-text {
            margin-top: 30px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar-container">
            <img src="https://cdn.simpleicons.org/realmadrid" alt="Amine Elyoussfi" class="avatar">
        </div>
        
        <h1>أمين إليوسفي</h1>
        <p>مطور برمجيات & صانع محتوى 🚀</p>

        <div class="links-container">
            <!-- الموقع الشخصي -->
            <a href="https://alyoussfiamine-pixel.github.io/MarocHubOnline/" target="_blank" class="social-link web">
                <i class="fa-solid fa-globe" style="color: #3b82f6;"></i>
                <span>موقعي الرسمي</span>
            </a>

            <!-- GitHub -->
            <a href="https://github.com/alyoussfiamine-pixel" target="_blank" class="social-link github">
                <i class="fa-brands fa-github" style="color: #ffffff;"></i>
                <span>GitHub</span>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/mentality.built?igsi=MW85ZDM2MnlkZzdybw==" target="_blank" class="social-link insta">
                <i class="fa-brands fa-instagram" style="color: #ec4899;"></i>
                <span>Instagram</span>
            </a>

            <!-- TikTok -->
            <a href="https://tiktok.com/@amine.al.1" target="_blank" class="social-link tiktok">
                <i class="fa-brands fa-tiktok" style="color: #06b6d4;"></i>
                <span>TikTok</span>
            </a>

            <!-- YouTube -->
            <a href="https://youtube.com/@aminepalmar?si=lnIA4fCF6QCeQXkC" target="_blank" class="social-link youtube">
                <i class="fa-brands fa-youtube" style="color: #ef4444;"></i>
                <span>YouTube</span>
            </a>
        </div>

        <div class="footer-text">
            <span>© MarocHubOnline 2026</span>
        </div>
    </div>

</body>
</html>
